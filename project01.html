<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project 01 · Ghost in the Machine</title>
  <link rel="stylesheet" href="style(1).css">



  
  <style>

  .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 9999; 
      background: white; 
      padding: 10px 0; 
    }



    body {
      background-color: #edf3ef;
      margin: 0;
      font-family: sans-serif;
    }

    @media (max-width: 600px) {
 .book { transform: scale(0.8); }
}
    .project-page {
      padding-top: 100px; 
      max-width: 1000px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      font-weight: 300;
      letter-spacing: 2px;
    }

    
    .book-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 0;
    }

    .book {
      position: relative;
      width: 320px;
      height: 420px;
      perspective: 1400px;
    }

    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: white;
      border: 1px solid #333;
      transform-origin: left;
      transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
      cursor: pointer;
      backface-visibility: hidden; 
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
      overflow: hidden; 
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover; 
    }

   
    .page:nth-child(1) { z-index: 14; }
    .page:nth-child(2) { z-index: 13; }
    .page:nth-child(3) { z-index: 12; }
    .page:nth-child(4) { z-index: 11; }
    .page:nth-child(5) { z-index: 10; }
    .page:nth-child(6) { z-index: 9; }
    .page:nth-child(7) { z-index: 8; }
    .page:nth-child(8) { z-index: 7; }
    .page:nth-child(9) { z-index: 6; }
    .page:nth-child(10) { z-index: 5; }
    .page:nth-child(11) { z-index: 4; }
    .page:nth-child(12) { z-index: 3; }
    .page:nth-child(13) { z-index: 2; }
    .page:nth-child(14) { z-index: 1; }

   
    .page.flipped {
      transform: rotateY(-160deg); 
      z-index: 20; 
    }

    
    .image-gallery {
      display: flex;
      flex-direction: column;
      gap: 50px;
      padding: 60px 20px 100px 20px;
      border-top: 1px solid #ccc;
      margin-top: 40px;
    }

    .image-item {
      width: 100%;
      background: #fff;
      padding: 15px;
      box-sizing: border-box;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border-radius: 4px;
    }

    .image-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    .image-label {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <header class="header">
    <nav class="nav">
      <a href="index.html#home">Home</a>
      <a href="index.html#projects">Project (CDU)</a>
      <a href="blog.html">Blog (Outputs)</a>
      <a href="rrr.html">RRR (Inputs)</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main class="project-page">
    <h1>Project#1 Ghost in the Machine</h1>

    <div class="book-wrapper">
      <div class="book">
    <div class="page"><img src="PROJECT01PAGE/zine01-01.jpg" alt="P1"></div>
        <div class="page"><img src="PROJECT01PAGE/zine01-02.jpg" alt="P2"></div>
        <div class="page"><img src="PROJECT01PAGE/zine01-03.jpg" alt="P3"></div>
        <div class="page"><img src="PROJECT01PAGE/zine01-04.jpg" alt="P4"></div>
        <div class="page"><img src="PROJECT01PAGE/zine01-05.jpg" alt="P5"></div>
        <div class="page"><img src="PROJECT01PAGE/zine01-06.jpg" alt="P6"></div>
        <div class="page"><img src="PROJECT01PAGE/zine01-07.jpg" alt="P7"></div>
        <div class="page"><img src="PROJECT01PAGE/zine01-08.jpg" alt="P8"></div>
        <div class="page"><img src="PROJECT01PAGE/zine01-09.jpg" alt="P9"></div>
        <div class="page"><img src="PROJECT01PAGE/zine01-10.jpg" alt="P10"></div>
        <div class="page"><img src="PROJECT01PAGE/zine01-11.jpg" alt="P11"></div>
        <div class="page"><img src="PROJECT01PAGE/zine01-12.jpg" alt="P12"></div>
        <div class="page"><img src="PROJECT01PAGE/zine01-13.jpg" alt="P13"></div>
        <div class="page"><img src="PROJECT01PAGE/zine01-14.jpg" alt="P14"></div>
      </div>
    </div>

    <div class="image-gallery">
      <div class="image-item">
        <img src="project01 set.jpg" alt="Project01 Set">
        <div class="image-label">Project 01 Set</div>
      </div>
      <div class="image-item">
        <img src="project02 set.jpg" alt="Project02 Set">
        <div class="image-label">Project 02 Set</div>
 <div class="image-item">
        <img src="project03 set.jpg" alt="project03 Set">

<div class="image-item">
        <img src="project04 set.jpg" alt="project04 Set">

      </div>
      </div>
  </main>

  <script>
    const pages = document.querySelectorAll('.page');
    
    pages.forEach((page, index) => {
      
      page.style.zIndex = pages.length - index;

      page.addEventListener('click', () => {
        if (!page.classList.contains('flipped')) {
         
          page.classList.add('flipped');
         
          page.style.zIndex = 20 + index; 
        } else {
          
          page.classList.remove('flipped');
          page.style.zIndex = pages.length - index;
        }
      });
    });
  </script>


<div class="image-gallery">
      <div class="image-item">
      
        <div class="image-label">Project 01 Set</div>
      </div>
      </div> 

  </div>
